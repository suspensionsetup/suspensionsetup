<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>Suspension setup</title>
<style>
  :root{--ink:#16181d;--muted:#5f6672;--line:#dde1e6;--soft:#f4f5f7;--field:#cfd4db;--ok:#1f7a4d;--bad:#a1262b;--bad-bg:#fbeceb;--note:#f6f1e4;--note-ink:#6b5113}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--soft);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:780px;margin:0 auto;padding:16px 16px 48px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 20px}
  .brand{min-width:0}
  .brand small{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .brand strong{display:block;font-size:20px;line-height:1.25;overflow-wrap:anywhere}
  .lang{display:flex;gap:2px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;flex:none}
  .lang button{border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--muted);padding:6px 9px;border-radius:7px;cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(18px,4vw,36px)}
  h1{font-size:clamp(24px,4vw,30px);line-height:1.2;margin:0 0 8px}
  h2{font-size:20px;line-height:1.3;margin:0 0 6px}
  .intro{color:var(--muted);margin:0 0 16px}
  .fuer{display:inline-block;background:var(--soft);border-radius:8px;padding:6px 10px;font-size:14px;margin:0 0 4px}
  .note{background:var(--note);color:var(--note-ink);border-radius:12px;padding:12px 14px;font-size:14px;margin:16px 0 0}
  .step{padding:28px 0;border-top:1px solid var(--line)}
  .step:first-of-type{border-top:0}
  .label{display:block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
  .wide{grid-column:1/-1}
  .field label,legend{display:block;font-weight:600;font-size:15px;margin:0 0 6px;padding:0}
  .opt-text{font-weight:400;color:var(--muted)}
  input[type=text],input[type=number],textarea{display:block;width:100%;background:#fff;border:1px solid var(--field);border-radius:9px;padding:12px 14px;font:inherit;font-size:16px;color:var(--ink)}
  textarea{min-height:96px;resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(22,24,29,.1)}
  ::placeholder{color:#9aa1ab}
  .hint{display:block;color:var(--muted);font-size:13px;line-height:1.45;margin-top:6px}
  fieldset{border:0;margin:24px 0 0;padding:0;min-width:0}
  legend{margin-bottom:10px}
  .options{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
  .option{position:relative;display:block;cursor:pointer;margin:0}
  .option input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
  .option span{display:block;height:100%;padding:14px;border:1px solid #d5d9df;border-radius:12px;background:#fff;transition:border-color .15s,background-color .15s}
  .option strong{display:block;font-size:16px;font-weight:600;margin-bottom:4px}
  .option small{display:block;color:var(--muted);font-size:13px;line-height:1.45}
  .option:hover span{border-color:#9aa1ab}
  .option input:checked+span{border-color:var(--ink);background:var(--soft);box-shadow:inset 0 0 0 1px var(--ink)}
  .option input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
  .pills{display:flex;flex-wrap:wrap;gap:8px}
  .pills .option span{padding:10px 18px;border-radius:999px;font-weight:600;font-size:15px}
  .submit{display:block;width:100%;margin:26px 0 0;padding:16px 20px;border:0;border-radius:11px;background:var(--ink);color:#fff;font:inherit;font-size:17px;font-weight:600;cursor:pointer}
  .submit:disabled{opacity:.7;cursor:wait}
  .privacy{color:var(--muted);font-size:13px;line-height:1.5;margin:14px 0 0;text-align:center}
  .error{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:14px 16px;margin-top:20px}
  .center{text-align:center;padding:24px 0}
  .check{width:52px;height:52px;border-radius:50%;background:#e6f3ec;color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:28px;font-weight:700}
  [hidden]{display:none !important}
  @media (max-width:640px){.grid{grid-template-columns:1fr}.options{grid-template-columns:1fr}.brand strong{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><small data-t="kopf_label"></small><strong id="haendler"></strong></div>
    <div class="lang" role="group" id="lang"></div>
  </header>

  <main class="card">
    <section id="v-laden" class="center"><p data-t="laden"></p></section>

    <section id="v-ungueltig" class="center" hidden>
      <h1 data-t="ungueltig_titel"></h1>
      <p class="intro" data-t="ungueltig_text"></p>
    </section>

    <section id="v-danke" class="center" hidden tabindex="-1">
      <div class="check" aria-hidden="true">✓</div>
      <span class="label" data-t="angaben_erhalten"></span>
      <h1 data-t="danke"></h1>
      <p class="intro" id="danke-text"></p>
    </section>

    <form id="f" hidden novalidate>
      <div>
        <h1 data-t="titel"></h1>
        <p class="intro" data-t="intro"></p>
        <p class="fuer" id="fuer" hidden></p>
        <p class="note" id="schon" data-t="schon_ausgefuellt" hidden></p>
      </div>

      <div class="step">
        <span class="label" data-t="schritt_name"></span>
        <h2 data-t="name_frage"></h2>
        <div class="grid">
          <div class="field wide">
            <label for="f-name" data-t="name"></label>
            <input id="f-name" type="text" data-key="name" autocomplete="name" required>
          </div>
        </div>
      </div>

      <div class="step">
        <span class="label" data-t="schritt_fahrer"></span>
        <h2 data-t="fahrer_frage"></h2>
        <p class="intro" data-t="fahrer_intro"></p>
        <div class="grid">
          <div class="field">
            <label for="f-kg" data-t="gewicht"></label>
            <input id="f-kg" type="number" inputmode="decimal" data-key="gewicht" min="30" max="200" step="0.5" data-tp="bsp_gewicht" required>
            <small class="hint" data-t="gewicht_hinweis"></small>
          </div>
        </div>
        <fieldset><legend data-t="einsatzbereich"></legend><div class="options" id="o-einsatz"></div></fieldset>
        <fieldset><legend data-t="fahrstil"></legend><div class="options" id="o-stil"></div></fieldset>
        <fieldset><legend data-t="fahrkoennen"></legend><div class="options" id="o-koennen"></div></fieldset>
      </div>

      <div class="step">
        <span class="label" data-t="schritt_bike"></span>
        <h2 data-t="bike_frage"></h2>
        <div class="grid">
          <div class="field"><label for="f-marke" data-t="marke"></label><input id="f-marke" type="text" data-key="marke" data-tp="bsp_marke" required></div>
          <div class="field"><label for="f-modell" data-t="modell"></label><input id="f-modell" type="text" data-key="modell" data-tp="bsp_modell" required></div>
          <div class="field"><label for="f-jahr" data-t="jahrgang"></label><input id="f-jahr" type="number" inputmode="numeric" data-key="jahr" min="1990" max="2035" data-tp="bsp_jahrgang" required></div>
          <div class="field"><label for="f-groesse" data-t="rahmengroesse"></label><input id="f-groesse" type="text" data-key="rahmengroesse" data-tp="bsp_rahmengroesse"></div>
          <div class="field wide">
            <label for="f-fw" data-t="federweg_einstellung"></label>
            <input id="f-fw" type="text" data-key="federweg_einstellung" data-tp="bsp_federweg_einstellung">
            <small class="hint" data-t="federweg_hinweis"></small>
          </div>
        </div>
        <fieldset><legend data-t="laufradgroesse"></legend><div class="pills" id="o-rad"></div></fieldset>
        <fieldset><legend data-t="e_bike"></legend><div class="pills" id="o-ebike"></div></fieldset>
      </div>

      <div class="step">
        <span class="label" data-t="schritt_fahrwerk"></span>
        <h2 data-t="fahrwerk_titel"></h2>
        <p class="intro" data-t="fahrwerk_intro"></p>
        <div class="grid">
          <div class="field"><label for="f-gabel" data-t="gabel"></label><input id="f-gabel" type="text" data-key="gabel" data-tp="bsp_gabel"></div>
          <div class="field"><label for="f-gabel-sn" data-t="gabel_sn"></label><input id="f-gabel-sn" type="text" data-key="gabel_seriennummer" autocapitalize="characters"></div>
          <div class="field"><label for="f-daempfer" data-t="daempfer"></label><input id="f-daempfer" type="text" data-key="daempfer" data-tp="bsp_daempfer"></div>
          <div class="field"><label for="f-daempfer-sn" data-t="daempfer_sn"></label><input id="f-daempfer-sn" type="text" data-key="daempfer_seriennummer" autocapitalize="characters"></div>
          <div class="field wide">
            <label for="f-setup"><span data-t="setup"></span> <span class="opt-text" data-t="optional"></span></label>
            <textarea id="f-setup" data-key="setup" rows="3" data-tp="bsp_setup"></textarea>
            <small class="hint" data-t="setup_hinweis"></small>
          </div>
        </div>
      </div>

      <div class="step">
        <span class="label" data-t="schritt_ziel"></span>
        <h2 id="wunsch-h" data-t="ziel_frage"></h2>
        <div class="field">
          <textarea id="f-wunsch" aria-labelledby="wunsch-h" data-key="wunsch" rows="5" data-tp="bsp_ziel" required></textarea>
          <small class="hint" data-t="ziel_hinweis"></small>
        </div>
        <div class="error" id="fehler" role="alert" hidden></div>
        <button type="submit" class="submit" data-t="senden"></button>
        <p class="privacy" id="privacy"></p>
      </div>
    </form>
  </main>
</div>

  function pruefeFahrwerk() {
    var ok = gabel.value.trim() || daempfer.value.trim();
    gabel.setCustomValidity(ok ? '' : t('gabel_oder_daempfer_html'));
  }
  gabel.addEventListener('input', pruefeFahrwerk);
  daempfer.addEventListener('input', pruefeFahrwerk);

  function daten() {
    var d = { formular: 'fahrwerk', version: 3, seite: 'neutral', sprache: lang, code: code, gesendet: new Date().toISOString() };
    form.querySelectorAll('[data-key]').forEach(function (el) {
      if ((el.type === 'radio' || el.type === 'checkbox') && !el.checked) return;
      d[el.getAttribute('data-key')] = el.value.trim();
    });
    return d;
  }

  var sendet = false;
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (sendet) return;
    pruefeFahrwerk();
    if (!form.checkValidity()) { form.reportValidity(); return; }
    var fehler = document.getElementById('fehler');
    var button = form.querySelector('.submit');
    fehler.hidden = true;
    sendet = true;
    button.disabled = true;
    button.textContent = t('wird_gesendet_html');
    fetch(ENDPOINT, { method: 'POST', body: JSON.stringify(daten()) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res || !res.ok) throw new Error('nicht gespeichert');
        zeige('v-danke');
        var v = document.getElementById('v-danke');
        v.focus();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      })
      .catch(function () {
        sendet = false;
        button.disabled = false;
        button.textContent = t('senden');
        var h = info && info.haendler;
        fehler.innerHTML = '<strong>' + esc(t('fehler')) + '</strong> ' + esc(h ? t('fehler_text').replace('{h}', h) : t('fehler_text_ohne'));
        fehler.hidden = false;
      });
  });

  texteSetzen();
  if (!/^[0-9A-Za-z-]{10,60}$/.test(code)) { zeige('v-ungueltig'); return; }
  fetch(ENDPOINT + '?aktion=formular&c=' + encodeURIComponent(code))
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (!res || !res.ok) throw new Error('ungültig');
      info = res;
      if (!params.get('lang') && res.sprache && SPRACHEN.indexOf(res.sprache) > -1) lang = res.sprache;
      texteSetzen();
      zeige('f');
    })
    .catch(function () { zeige('v-ungueltig'); });
})();
</script>
</body>
</html>
